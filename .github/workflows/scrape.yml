name: CubeCraft Turbo Scraper

on:
  workflow_dispatch: # Allows you to click a button to run it whenever you want!

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push results back to repo
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add cubecraft_forum_data.jsonl
          git commit -m "Auto-update scraped dataset [skip ci]" || exit 0
          git push
